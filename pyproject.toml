[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiteval-web"
version = "3.0.0"
description = "FITEVAL - program for model goodness-of-fit evaluation (Python web port of the MATLAB desktop app)"
authors = [
    { name = "Axel Ritter" },
    { name = "Rafael Munoz-Carpena" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
app = [
    "dash>=2.16",
    "dash-bootstrap-components>=1.5",
    "waitress>=2.1",
]
dev = [
    "pytest>=7",
]

[tool.setuptools]
packages = ["fiteval_core", "fiteval_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
